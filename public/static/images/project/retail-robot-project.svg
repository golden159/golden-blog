<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Retail robot voice system</title>
  <desc id="desc">A visual chain from speech recognition to language understanding, speech synthesis, and robot actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#18181b" />
      <stop offset="1" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1">
      <stop offset="0" stop-color="#fbcfe8" />
      <stop offset="1" stop-color="#f472b6" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#bg)" />
  <g fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M126 200h70m102 0h70m102 0h70" />
    <path d="m182 184 16 16-16 16m102-16 16 16-16 16m102-16 16 16-16 16" />
  </g>
  <g fill="url(#node)" stroke="#fce7f3" stroke-width="3">
    <rect x="34" y="150" width="92" height="100" rx="18" />
    <rect x="196" y="150" width="102" height="100" rx="18" />
    <rect x="368" y="150" width="102" height="100" rx="18" />
    <rect x="540" y="150" width="26" height="100" rx="13" />
  </g>
  <g fill="#18181b" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="80" y="207">ASR</text>
    <text x="247" y="207">LLM</text>
    <text x="419" y="207">TTS</text>
  </g>
  <g fill="#fce7f3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="300" y="84">RETAIL ROBOT</text>
    <text x="300" y="330">voice · safety · navigation · vision</text>
  </g>
</svg>
